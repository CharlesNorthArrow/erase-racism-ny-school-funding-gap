<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New York School Funding Gap | ERASE Racism</title>
  <meta name="description" content="ERASE Racism school funding gap report — temporarily offline while we incorporate updates based on a methodological review." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --purple-dark:   #6B2680;
      --purple-accent: #AE43CE;
      --purple-darker: #57146D;
      --purple-light:  #E8D4F0;
      --purple-faint:  #F5F1F6;
      --brown-text:    #3D3630;
      --white:         #FFFFFF;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Source Sans 3', sans-serif;
      color: var(--brown-text);
      background: var(--white);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      line-height: 1.6;
    }
    header {
      background: var(--purple-darker);
      padding: 14px 24px;
    }
    .header-inner {
      display: flex;
      align-items: center;
      gap: 14px;
      max-width: 1140px;
      margin: 0 auto;
      text-decoration: none;
    }
    .header-logo { height: 44px; width: auto; background: white; border-radius: 6px; padding: 3px 5px; }
    .header-brand-text { display: flex; flex-direction: column; }
    .header-brand-text .org { font-family: 'Merriweather', serif; font-size: 12px; color: var(--purple-light); letter-spacing: .05em; text-transform: uppercase; }
    .header-brand-text .title { font-family: 'Merriweather', serif; font-size: 17px; color: var(--white); font-weight: 700; line-height: 1.2; }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }
    .notice {
      max-width: 640px;
      text-align: center;
    }
    .notice h1 {
      font-family: 'Merriweather', serif;
      color: var(--purple-dark);
      font-size: clamp(24px, 4vw, 34px);
      line-height: 1.25;
      margin-bottom: 18px;
    }
    .notice p {
      font-size: 17px;
      color: var(--brown-text);
      margin: 0 auto;
      max-width: 540px;
    }
    footer {
      background: var(--purple-darker);
      color: var(--purple-light);
      padding: 18px 24px;
      font-size: 13px;
      text-align: center;
    }
    footer a { color: var(--purple-light); }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <img src="logo.png" alt="ERASE Racism" class="header-logo" />
      <div class="header-brand-text">
        <span class="org">ERASE Racism</span>
        <span class="title">New York School Funding Gap</span>
      </div>
    </div>
  </header>

  <main>
    <div class="notice" role="status">
      <h1>Temporarily offline</h1>
      <p>This report is temporarily offline while we incorporate updates based on a methodological review.</p>
    </div>
  </main>

  <footer>
    <a href="https://www.eraseracismny.org/" target="_blank" rel="noopener">eraseracismny.org &#8599;</a>
  </footer>
</body>
</html>
